[package]
name = "killi"
description = "Fast, tiny AI coding agent for the terminal: one small native binary, OpenAI- and Anthropic-compatible models, MCP, subagents, prompt-cache-friendly"
homepage = "https://github.com/timwuhaotian/killi"
keywords = ["ai", "coding-agent", "llm", "cli", "mcp"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/timwuhaotian/killi"
readme = "../../README.md"

[dependencies]
anyhow.workspace = true
base64 = "0.22.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dom_smoothie = "0.18.2"
futures-util.workspace = true
globset.workspace = true
ignore.workspace = true
libc.workspace = true
regex.workspace = true
reqwest.workspace = true
ring = { version = "0.17.14", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
unicode-width = "0.2.2"
