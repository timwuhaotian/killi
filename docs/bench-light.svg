<text x="32" y="608" font-size="12" fill="#6b7280">Measured 2026-10-22 on an Apple M4 Pro (macOS 27) with scripts/bench.py, each tool given “Reply with the single word OK.” in an empty folder.</text>
<text x="32" y="626" font-size="12" fill="#6b7280">Size is the installed binary (Kimi Code’s includes its bundled rg and fd). Memory is the median maximum resident set size of 3 runs.</text>
<text x="32" y="644" font-size="12" fill="#6b7280">Tokens are the first request’s input as each tool reports it; Kimi Code and Claude Code include this machine’s skills and MCP servers.</text>
