<text x="32" y="728" font-size="12" fill="#6b7280">Measured 2026-10-22 and 2026-10-23 on Apple M1 Pro, macOS 26.6.2 with scripts/bench.py, prompt “Reply with the single word OK.” in an empty folder.</text>
<text x="32" y="746" font-size="12" fill="#6b7280">Size is the installed binary (Kimi Code’s includes its bundled rg and fd). Memory is the median maximum resident set size of 3 runs.</text>
<text x="32" y="764" font-size="12" fill="#6b7280">Tokens are the first request’s input as each tool reports it, with this machine’s skills, instructions and MCP servers loaded;</text>
<text x="32" y="782" font-size="12" fill="#6b7280">opencode 2 ran with a fresh config holding only the model, so it loaded this machine’s skills but none of its MCP servers.</text>
<text x="32" y="800" font-size="12" fill="#6b7280">By default opencode 2 uses a background service; it was measured with --standalone, so everything is in one process.</text>
</svg>
