<text x="86.2" y="346.5" textLength="850.2" lengthAdjust="spacingAndGlyphs" fill="#e8eef2" xml:space="preserve">         Continue an earlier session in this folder                                                          </text>
<text x="16.0" y="366.5" textLength="140.4" lengthAdjust="spacingAndGlyphs" fill="#e8eef2" xml:space="preserve">  /reload         </text>
<text x="156.4" y="366.5" textLength="343.2" lengthAdjust="spacingAndGlyphs" fill="#8e9cab" xml:space="preserve">Re-read [prompt], AGENTS.md files and skills</text>
<text x="16.0" y="386.5" textLength="140.4" lengthAdjust="spacingAndGlyphs" fill="#e8eef2" xml:space="preserve">  /refactor       </text>
<text x="156.4" y="386.5" textLength="780.0" lengthAdjust="spacingAndGlyphs" fill="#8e9cab" xml:space="preserve">Surgical code refactoring to improve maintainability without changing behavior. Covers extracting fu</text>
