<text x="140.8" y="426.5" textLength="795.6" lengthAdjust="spacingAndGlyphs" fill="#8e9cab" xml:space="preserve">Surgical code refactoring to improve maintainability without changing behavior. Covers extracting fun…</text>
<text x="16.0" y="446.5" textLength="124.8" lengthAdjust="spacingAndGlyphs" fill="#e8eef2" xml:space="preserve">  /share        </text>
<text x="140.8" y="446.5" textLength="569.4" lengthAdjust="spacingAndGlyphs" fill="#8e9cab" xml:space="preserve">Copy this session's id, log path and summary, to paste into another agent</text>
<text x="16.0" y="466.5" textLength="124.8" lengthAdjust="spacingAndGlyphs" fill="#e8eef2" xml:space="preserve">  /prune        </text>
