[workspace]
resolver = "3"
members = ["crates/killi"]
exclude = ["evals"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
futures-util = "0.3"
globset = "0.4"
ignore = "0.4"
libc = "0.2.183"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "process", "time", "io-util", "sync"] }
toml = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
